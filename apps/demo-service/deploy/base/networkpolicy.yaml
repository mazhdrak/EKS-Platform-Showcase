---
# Default-deny ingress for the namespace, then allow only HTTP to the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service-allow-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
