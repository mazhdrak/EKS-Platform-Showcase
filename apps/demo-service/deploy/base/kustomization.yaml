---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: demo-service
      app.kubernetes.io/part-of: eks-platform-showcase
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
images:
  - name: demo-service
    newName: demo-service
    newTag: local
