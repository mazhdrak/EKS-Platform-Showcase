---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../base
# CI rewrites newName/newTag on every merge to main (see .github/workflows/app.yaml).
images:
  - name: demo-service
    newName: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/eks-showcase/demo-service
    newTag: 0.1.0
