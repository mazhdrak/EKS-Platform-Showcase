---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/demo-service/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -cover ./...

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/demo-service
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/terraform/bootstrap
          - infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - name: fmt
        # Each unformatted file becomes an inline annotation with its diff.
        run: |
          files=$(terraform fmt -check -recursive -list=true infra/terraform || true)
          [ -z "$files" ] && exit 0
          for f in $files; do
            diff=$(terraform fmt -diff -check "$f" | tail -n +3 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error file=$f,title=terraform fmt::${diff}"
          done
          exit 1
      - name: validate
        if: success() || failure()
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -backend=false -input=false
          terraform validate -json > validate.json || true
          jq -r --arg root "${{ matrix.root }}" '.diagnostics[] |
            "::\(.severity) file=\($root)/\(.range.filename // "."),line=\(.range.start.line // 1)"
            + ",title=\(.summary)::\(.detail // "" | gsub("\n"; "%0A"))"' validate.json
          jq -e '.valid' validate.json > /dev/null
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        if: success() || failure()
        working-directory: ${{ matrix.root }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" --recursive
        env:
          GITHUB_TOKEN: ${{ github.token }}

  kubernetes:
    name: kustomize build / kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - run: pip install yamllint && yamllint gitops apps/demo-service/deploy .github kind
      - name: render and validate every kustomization
        env:
          # Schemas for Argo CD, Prometheus Operator and Kyverno CRDs
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          for dir in apps/demo-service/deploy/overlays/* gitops/platform/*; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location "$CRD_SCHEMAS"
            echo "::endgroup::"
          done
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            gitops/clusters

  security:
    name: checkov (IaC + manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      # Each step reports findings as inline annotations (file + line).
      - name: terraform
        run: |
          checkov -d infra/terraform --framework terraform --config-file .checkov.yaml -o json > tf.json || true
          python3 scripts/ci/checkov-annotate.py tf.json infra/terraform
      - name: kubernetes
        if: success() || failure()
        run: |
          checkov -d apps/demo-service/deploy --framework kustomize --config-file .checkov.yaml -o json > k8s.json || true
          python3 scripts/ci/checkov-annotate.py k8s.json apps/demo-service/deploy
      - name: dockerfile
        if: success() || failure()
        run: |
          checkov -f apps/demo-service/Dockerfile --framework dockerfile --config-file .checkov.yaml -o json > docker.json || true
          python3 scripts/ci/checkov-annotate.py docker.json .
