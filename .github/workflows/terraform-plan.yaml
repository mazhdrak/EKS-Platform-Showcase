---
name: terraform-plan

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform-*.yaml

permissions:
  contents: read
  id-token: write        # OIDC to AWS, no long-lived keys
  pull-requests: write   # post the plan as a PR comment

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Skipped until AWS is wired up (see docs/getting-started.md), so the
    # repository stays green for anyone who forks it.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - name: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
            -var 'api_allowed_cidrs=${{ vars.API_ALLOWED_CIDRS }}' \
            -var "gitops_repo_url=https://github.com/${{ github.repository }}.git" \
            | tee plan.txt
          terraform show -no-color tfplan > /dev/null
      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('infra/terraform/environments/dev/plan.txt', 'utf8');
            const summary = (raw.match(/^Plan: .*$/m) || raw.match(/^No changes\..*$/m) || ['(no summary)'])[0];
            const body = [
              '### terraform plan: `environments/dev`',
              `**${summary}**`,
              '<details><summary>Full plan</summary>',
              '',
              '```',
              raw.length > 60000 ? raw.slice(-60000) : raw,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
