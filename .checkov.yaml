---
# Accepted risks are listed here with a reason, never silently skipped.
compact: true
quiet: true
skip-check:
  # Registry modules are pinned with semver constraints + .terraform.lock.hcl and
  # bumped by Renovate; git-SHA sources would lose registry version resolution.
  - CKV_TF_1
  # ECR: AES256 is sufficient for a public demo image; KMS CMK adds cost.
  - CKV_AWS_136
  # S3 state bucket: access logging / cross-region replication out of scope for a demo.
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV2_AWS_62
  - CKV2_AWS_61
  # Apply role uses AdministratorAccess by design; see docs/adr/0004-ci-credentials.md.
  - CKV_AWS_274
  # Image is pinned by the GitOps overlay, not by digest in the base manifest.
  - CKV_K8S_43
  # CPU limits cause CFS throttling without protecting neighbours; requests +
  # memory limits are enforced instead (gitops/platform/policies/require-resources.yaml).
  - CKV_K8S_11
  # Docker HEALTHCHECK is ignored by Kubernetes; readiness/liveness probes are used.
  - CKV_DOCKER_2
