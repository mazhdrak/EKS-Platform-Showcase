---
# Local stand-in for EKS: 1 control plane + 2 workers spread over two fake
# "zones" so topologySpreadConstraints behave like they do in AWS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eks-showcase
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-b
